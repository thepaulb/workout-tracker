services:
  app:
    build: .
    # No published port — only reachable through Caddy, over the internal
    # compose network (Docker manages iptables for published ports in a way
    # that can bypass ufw, so the app simply isn't given a port to publish).
    env_file:
      - .env
    environment:
      DB_PATH: /data/gym.db
    volumes:
      - gym-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  gym-data:
  caddy-data:
  caddy-config:
