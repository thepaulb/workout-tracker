services:
  app:
    image: ghcr.io/thepaulb/workout-tracker:latest
    # `build: .` is kept alongside `image:` so `docker compose build` still
    # works as a manual fallback (e.g. if the registry is unreachable) —
    # normal deploys use `docker compose pull` to fetch the image CI built.
    build: .
    # No published port — only reachable through the shared Caddy in
    # proxy/, over the external `web` network (Docker manages iptables for
    # published ports in a way that can bypass ufw, so the app simply isn't
    # given a port to publish).
    env_file:
      - .env
    environment:
      DB_PATH: /data/gym.db
    volumes:
      - gym-data:/data
    networks:
      web:
        # Unique name on the shared network — other apps' services are also
        # called `app`, so Caddy addresses this one by alias.
        aliases:
          - gym
    restart: unless-stopped

volumes:
  gym-data:

networks:
  web:
    external: true
