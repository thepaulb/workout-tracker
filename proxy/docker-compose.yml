# Shared Caddy, run as its own compose project so apps can deploy
# independently of each other and of the proxy.
#
#   docker network create web        # once, before anything else
#   cd ~/workout-tracker/proxy && docker compose up -d
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web
    restart: unless-stopped

volumes:
  # Reuses the volume Caddy had when it lived in the workout-tracker compose
  # project, so existing TLS certificates carry over. Check the real name
  # with `docker volume ls | grep caddy` before first start.
  caddy-data:
    external: true
    name: workout-tracker_caddy-data
  caddy-config:

networks:
  web:
    external: true
