services:
  app:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      # Overrides .env's dev-time value so the DB lives on the volume below
      # instead of inside the container's throwaway filesystem.
      DB_PATH: /data/gym.db
    volumes:
      - gym-data:/data
    restart: unless-stopped

volumes:
  gym-data:
